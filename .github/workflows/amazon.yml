name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, the same release build as Play (the app has
# no Google Play links or review prompt). Run on an emulator without Google Play services (like Fire).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      VERSION_NAME: 1.0.0
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 17 (for Android/Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
    - name: Validate required secrets
      env:
        HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        HAS_GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: "missing=0\nif [ -z \"$ADMOB_ANDROID_APP_ID\" ]; then echo \"::error::Missing secret ADMOB_ANDROID_APP_ID\"; missing=1; fi\nif [ -z \"$ADMOB_BANNER_AD_ID\" ]; then echo \"::error::Missing secret ADMOB_BANNER_AD_ID\"; missing=1; fi\nif [ -z \"$ADMOB_INTERSTITIAL_AD_ID\" ]; then echo \"::error::Missing secret ADMOB_INTERSTITIAL_AD_ID\"; missing=1; fi\nif [ -z \"$HAS_PLAY_JSON\" ]; then echo \"::warning::PLAY_SERVICE_ACCOUNT_JSON not set \u2014 build will succeed but publish will be skipped. Follow store/SERVICE_ACCOUNT.md\"; fi\n# GOOGLE_SERVICES_JSON is optional if you commit google-services.json via artifact, but recommended as secret\nif [ -z \"$HAS_GOOGLE_JSON\" ] && [ ! -f google-services.json ]; then echo \"::warning::GOOGLE_SERVICES_JSON secret not set and google-services.json not in repo \u2014 Firebase build may fail\"; fi\nif [ \"$missing\" -eq 1 ]; then exit 1; fi\necho \"\u2713 AdMob secrets present\"\necho \"VERSION_CODE=$VERSION_CODE\"\necho \"If this VERSION_CODE\
        \ is not higher than existing Play version, set a larger version_code input.\"\n"
    - name: Install deps
      run: 'pnpm install --no-frozen-lockfile || npm install

        '
    - name: Restore google-services.json from secret (if provided)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: "if [ -n \"$GOOGLE_SERVICES_JSON\" ]; then\n  echo \"$GOOGLE_SERVICES_JSON\" > google-services.json\n  # Support base64-encoded variant\n  if head -c 1 google-services.json | grep -q \"{\"; then\n    echo \"\u2713 google-services.json restored from secret (plain JSON)\"\n  else\n    echo \"Detected base64 \u2014 decoding...\"\n    echo \"$GOOGLE_SERVICES_JSON\" | base64 --decode > google-services.json\n    echo \"\u2713 decoded base64\"\n  fi\n  cat google-services.json | head -c 200; echo \"...\"\nelif [ -f google-services.json ]; then\n  echo \"\u2713 google-services.json already present (committed or generated)\"\nelse\n  echo \"::warning::No google-services.json \u2014 Firebase may not initialize\"\nfi\n"
    - name: Restore upload keystore from secrets (if provided)
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: "mkdir -p android/app || true\nif [ -n \"$KEYSTORE_BASE64\" ]; then\n  echo \"$KEYSTORE_BASE64\" | base64 --decode > android/app/upload.keystore\n  echo \"\u2713 Upload keystore restored to android/app/upload.keystore\"\n  ls -lh android/app/upload.keystore\n  # Export for build.gradle signingConfigs.release\n  echo \"ANDROID_KEYSTORE_FILE=android/app/upload.keystore\" >> $GITHUB_ENV\n  echo \"ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD\" >> $GITHUB_ENV\n  echo \"ANDROID_KEY_ALIAS=$KEY_ALIAS\" >> $GITHUB_ENV\n  echo \"ANDROID_KEY_PASSWORD=$KEY_PASSWORD\" >> $GITHUB_ENV\nelse\n  echo \"::notice::ANDROID_KEYSTORE_BASE64 not set \u2014 generating release keystore for bundle signing...\"\n  keytool -genkeypair -v -storetype PKCS12 -keystore android/app/release.keystore -alias octopulse-key -keyalg RSA -keysize 2048 -validity 10000 -storepass octopulse123 -keypass octopulse123 -dname \"CN=OctoPulse, OU=Apps, O=Charles, L=US, S=US, C=US\"\n  echo \"ANDROID_KEYSTORE_FILE=android/app/release.keystore\"\
        \ >> $GITHUB_ENV\n  echo \"ANDROID_KEYSTORE_PASSWORD=octopulse123\" >> $GITHUB_ENV\n  echo \"ANDROID_KEY_ALIAS=octopulse-key\" >> $GITHUB_ENV\n  echo \"ANDROID_KEY_PASSWORD=octopulse123\" >> $GITHUB_ENV\nfi\n"
    - name: Expo config check (verify AdMob & versionCode injected)
      run: "npx expo config --type public > /tmp/expo-config.json\ncat /tmp/expo-config.json | grep -E \"googleMobileAdsAppId|versionCode|version|package\" | head -n 30\necho \"Checking no production AdMob IDs hardcoded in repo...\"\nif grep -R \"ca-app-pub-\" --include=\"*.json\" --include=\"*.js\" --include=\"*.ts\" --include=\"*.tsx\" . --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android 2>/dev/null | grep -v \".env\" | grep -v \"3940256099942544\" | grep -v \"ca-app-pub-\\.\\.\\.\" | grep -q \"ca-app-pub-\"; then\n  echo \"::error::Production AdMob ID found hardcoded in repo! Use env vars only (test ID 394... is allowed).\"\n  grep -R \"ca-app-pub-\" --include=\"*.json\" --include=\"*.js\" --include=\"*.ts\" --include=\"*.tsx\" . --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android | grep -v \".env\" | grep -v \"3940256099942544\" | grep -v \"ca-app-pub-\\.\\.\\.\" || true\n  exit 1\nfi\necho \"\u2713 Config check passed \u2014 VERSION_CODE=$VERSION_CODE\
        \ injected via env\"\n"
    - name: Prebuild (verify and preserve android native files)
      run: "if [ -f android/app/src/main/java/com/charles/octopulse/MLKitTranslateModule.kt ]; then\n  echo \"Custom MLKit native files detected \u2014 preserving existing native configuration\"\nelse\n  npx expo prebuild --clean --no-install\nfi\n"
    - name: Verify AndroidManifest contains AdMob App ID and correct package
      run: "MANIFEST=\"android/app/src/main/AndroidManifest.xml\"\nif grep -q \"$ADMOB_ANDROID_APP_ID\" \"$MANIFEST\"; then echo \"\u2713 Manifest has AdMob App ID\"; else echo \"::error::Manifest missing AdMob App ID\"; cat \"$MANIFEST\" | grep -A2 -B2 \"ADMOB\\|APPLICATION_ID\" || true; exit 1; fi\nif grep -q \"com.charles.octopulse\" \"$MANIFEST\"; then echo \"\u2713 Manifest package correct\"; else echo \"::warning::Package not found in manifest (may be in build.gradle)\"; cat \"$MANIFEST\" | head -n 40; fi\necho \"versionCode in build.gradle:\"\ngrep -n \"versionCode\" android/app/build.gradle || true\n"
    - name: Build amazon APK (same app, release)
      run: 'set -o pipefail

        cd android

        chmod +x gradlew

        ./gradlew assembleRelease --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 2>&1 | tee -a /tmp/amz-build.log

        cd ..

        mkdir -p amz-apk

        cp android/app/build/outputs/apk/release/app-release.apk amz-apk/OctoPulse-amazon-release.apk

        ls -la amz-apk

        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)

        $BT/apksigner verify --print-certs amz-apk/OctoPulse-amazon-release.apk | head -3 || true

        $BT/aapt2 dump badging amz-apk/OctoPulse-amazon-release.apk | head -3 || true

        echo "--- Play Store URL strings left in the release:"; unzip -p amz-apk/OctoPulse-amazon-release.apk ''classes*.dex'' ''assets/index.android.bundle'' | strings | grep -E "play\.google\.com/store|market://" | head || true

        '
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (no Google Play services, like Fire; the APK carries x86_64 libs for the emulator)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_OctoPulse_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/OctoPulse-amazon-release.apk
