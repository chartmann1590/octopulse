name: Build Android (AdMob via GitHub Secrets)

on:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "app.config.js"
      - "src/**"
      - "package.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Inject AdMob IDs from GitHub Secrets — never hardcode in repo
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      # Expo public vars (exposed to JS bundle via process.env)
      EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      # Optional iOS (if you add iOS build later)
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate AdMob secrets present
        run: |
          if [ -z "$ADMOB_ANDROID_APP_ID" ]; then echo "::error::ADMOB_ANDROID_APP_ID secret not set"; exit 1; fi
          if [ -z "$ADMOB_BANNER_AD_ID" ]; then echo "::error::ADMOB_BANNER_AD_ID secret not set"; exit 1; fi
          if [ -z "$ADMOB_INTERSTITIAL_AD_ID" ]; then echo "::error::ADMOB_INTERSTITIAL_AD_ID secret not set"; exit 1; fi
          echo "✓ AdMob secrets injected"

      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          else
            npm ci || npm install
          fi

      - name: Expo config check (verify AdMob IDs injected, not hardcoded)
        run: |
          npx expo config --type public | grep -q "googleMobileAdsAppId" && echo "config ok" || echo "config check done"
          # Ensure no non-test AdMob IDs are hardcoded in committed source (test ID 3940256099942544 is allowed)
          echo "Checking no production AdMob IDs hardcoded in repo..."
          if grep -R "ca-app-pub-" --include="*.json" --include="*.js" --include="*.ts" --include="*.tsx" . --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android 2>/dev/null | grep -v ".env" | grep -v "android-build.yml" | grep -v "3940256099942544" | grep -v "ca-app-pub-\.\.\." | grep -q "ca-app-pub-"; then
            echo "::error::Production AdMob ID found hardcoded in repo! Use env vars only (test ID 394... is allowed)."
            grep -R "ca-app-pub-" --include="*.json" --include="*.js" --include="*.ts" --include="*.tsx" . --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android | grep -v ".env" | grep -v "3940256099942544" | grep -v "ca-app-pub-\.\.\." || true
            exit 1
          else
            echo "✓ No hardcoded production IDs in tracked files"
          fi

      - name: Prebuild (generates android/ with AdMob App ID)
        run: npx expo prebuild --clean --no-install

      - name: Patch googleMobileAds SDK for Kotlin 2.1 compatibility
        run: |
          echo "Patching react-native-google-mobile-ads 25.4.0 -> 23.6.0 for Kotlin 2.1.20 compatibility"
          if grep -q "25.4.0" node_modules/react-native-google-mobile-ads/package.json; then
            jq '.sdkVersions.android.googleMobileAds = "23.6.0" | .sdkVersions.android.googleUmp = "3.1.0"' node_modules/react-native-google-mobile-ads/package.json > /tmp/pkg.json && mv /tmp/pkg.json node_modules/react-native-google-mobile-ads/package.json
            echo "✓ Patched googleMobileAds to 23.6.0"
            grep -A2 '"googleMobileAds"' node_modules/react-native-google-mobile-ads/package.json | head -n 5 || true
          else
            echo "Already patched or version not 25.4.0"
            grep -A2 '"googleMobileAds"' node_modules/react-native-google-mobile-ads/package.json | head -n 5 || true
          fi

      - name: Verify AndroidManifest contains AdMob App ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "$ADMOB_ANDROID_APP_ID" "$MANIFEST"; then
            echo "✓ AndroidManifest contains correct AdMob App ID"
          else
            echo "::error::AndroidManifest missing AdMob App ID"
            cat "$MANIFEST" | grep -A2 -B2 "ADMOB\|APPLICATION_ID" || true
            exit 1
          fi

      - name: Build Android (debug APK example)
        run: |
          cd android && ./gradlew assembleDebug --stacktrace
        # For release / Play Store, use EAS: `eas build --platform android --auto-submit`
        # EAS will also read the same env vars injected above.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: octopulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
